# Catalog cache. Ephemeral on purpose (lab). Kill it to see cache-miss latency in Grafana.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: ott
  labels:
    app: redis
    tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        tier: data
      annotations:
        ad.datadoghq.com/redis.checks: |
          {"redisdb":{"init_config":{},"instances":[{"host":"%%host%%","port":"6379"}]}}
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ott
spec:
  selector:
    app: redis
  ports:
    - {name: redis, port: 6379, targetPort: redis}
