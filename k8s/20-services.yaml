# Generated: 6 OTT microservices (StreamFlix). Image is substituted by scripts/up.sh
---
# API gateway / BFF for TV, mobile and web apps
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: ott
  labels: &labels
    app: gateway
    tier: edge
    app.kubernetes.io/part-of: ott-lab
    tags.datadoghq.com/env: lab
    tags.datadoghq.com/service: gateway
    tags.datadoghq.com/version: "1.0.0"
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels: *labels
      annotations:
        ad.datadoghq.com/app.checks: |
          {"openmetrics":{"init_config":{},"instances":[{"openmetrics_endpoint":"http://%%host%%:8080/metrics","namespace":"ottlab","metrics":["http_requests","http_request_duration_seconds","downstream_errors","ott_.*"],"tags":["app:gateway"]}]}}
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - {name: SERVICE, value: gateway}
            - {name: REDIS_HOST, value: redis}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 80Mi}
            limits: {cpu: 300m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ott
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - {name: http, port: 8080, targetPort: http}
