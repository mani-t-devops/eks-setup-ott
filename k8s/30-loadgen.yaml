# Synthetic viewers: browse home, open titles, press play, log in, subscribe.
# Tune with:  kubectl -n ott set env deploy/loadgen RPS=20
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: ott
  labels:
    app: loadgen
    tier: tooling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
        tier: tooling
    spec:
      containers:
        - name: loadgen
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          env:
            - {name: SERVICE, value: loadgen}
            - {name: TARGET, value: "http://gateway:8080"}
            - {name: RPS, value: "8"}
          ports:
            - {name: metrics, containerPort: 8080}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 100m, memory: 96Mi}
